<!DOCTYPE html>
<html>
<head>
<title>Login & Signup with Email</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
    emailjs.init("YOUR_PUBLIC_KEY"); // <-- replace
})();
</script>

<style>
body {
    font-family: Arial;
    background: #4facfe;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.box {
    background: white;
    padding: 20px;
    width: 350px;
    border-radius: 8px;
}
input, button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
}
button {
    background: #4facfe;
    color: white;
    border: none;
}
.message {
    text-align: center;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="box">
    <h2 id="title">Sign Up</h2>

    <input id="email" placeholder="Email">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <input id="code" placeholder="Verification Code" style="display:none">

    <button onclick="submitForm()">Submit</button>
    <div class="message" id="msg"></div>
</div>

<script>
let step = 1;
let verificationCode = "";

function submitForm() {
    let users = JSON.parse(localStorage.getItem("users")) || {};
    let email = email.value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let msg = document.getElementById("msg");

    if (step === 1) {
        if (users[username]) {
            msg.innerText = "Username already exists";
            return;
        }

        verificationCode = Math.floor(100000 + Math.random() * 900000).toString();

        emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
            to_email: email,
            code: verificationCode
        });

        users[username] = { email, password, verified: false };
        localStorage.setItem("users", JSON.stringify(users));

        msg.innerText = "Verification code sent to your email";
        document.getElementById("code").style.display = "block";
        step = 2;

    } else {
        if (document.getElementById("code").value === verificationCode) {
            users[username].verified = true;
            localStorage.setItem("users", JSON.stringify(users));
            msg.innerText = "Email verified! You can now log in.";
        } else {
            msg.innerText = "Invalid verification code";
        }
    }
}
</script>

</body>
</html>
